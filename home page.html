<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeeNow - Home</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>

<body>

<header>
    <img src="teenow.png" alt="TeeNow logo" class="logo">
</header>


<nav>
    <a href="#booking">Book</a>
    <a href="#course">Courses</a>
    <a href="#profile">Profile</a>
    <a href="#contact">Contact</a>
</nav>

<!-- Slideshow -->
<div class="slideshow-container">

    <!-- Full-width images with number and caption text -->
    <div class="mySlides fade">
      <div class="numbertext">1 / 3</div>
      <img src="druids-glen.png" style="width:100%">
      <div class="text">Druids Glen Course</div>
    </div>
  
    <div class="mySlides fade">
      <div class="numbertext">2 / 3</div>
      <img src="powerscourt-golf-club.png" style="width:100%">
      <div class="text">Powerscourt Golf Course</div>
    </div>
  
    <div class="mySlides fade">
      <div class="numbertext">3 / 3</div>
      <img src="european-club.png" style="width:100%">
      <div class="text">European Club</div>
    </div>
  
    <!-- Next and previous buttons -->
    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
    <a class="next" onclick="plusSlides(1)">&#10095;</a>
  </div>
  <br>
  
  <!-- The dots/circles -->
  <div style="text-align:center">
    <span class="dot" onclick="currentSlide(1)"></span>
    <span class="dot" onclick="currentSlide(2)"></span>
    <span class="dot" onclick="currentSlide(3)"></span>
  </div>

<!-- Buttons -->
<button class="open-button btn-signup" onclick="openSignupForm()">Sign Up</button>
<button class="open-button btn-login" onclick="openLoginForm()">Log In</button>


<div class="form-popup" id="signupForm">
  <form class="form-container">
    <h2>Sign Up</h2>

    <input type="text" placeholder="First Name" required>
    <input type="text" placeholder="Last Name" required>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>

    <button type="submit" class="btn">Sign Up</button>
    <button type="button" class="btn cancel" onclick="closeSignupForm()">Close</button>
  </form>
</div>

<div class="form-popup" id="loginForm">
  <form class="form-container">
    <h2>Log In</h2>

    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>

    <button type="submit" class="btn">Log In</button>
    <button type="button" class="btn cancel" onclick="closeLoginForm()">Close</button>
  </form>
</div>

<script>
function openSignupForm() {
  document.getElementById("signupForm").style.display = "block";
}

function closeSignupForm() {
  document.getElementById("signupForm").style.display = "none";
}

function openLoginForm() {
  document.getElementById("loginForm").style.display = "block";
}

function closeLoginForm() {
  document.getElementById("loginForm").style.display = "none";
}

let slideIndex = 1;
showSlides(slideIndex);

// Next/previous controls
function plusSlides(n) {
  showSlides(slideIndex += n);
}

// Thumbnail image controls
function currentSlide(n) {
  showSlides(slideIndex = n);
}

function showSlides(n) {
  let i;
  let slides = document.getElementsByClassName("mySlides");
  let dots = document.getElementsByClassName("dot");
  if (n > slides.length) {slideIndex = 1}
  if (n < 1) {slideIndex = slides.length}
  for (i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";
  }
  for (i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" active", "");
  }
  slides[slideIndex-1].style.display = "block";
  dots[slideIndex-1].className += " active";
}
</script>

</body>
</html>
